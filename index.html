<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1C4FA0">
<meta name="description" content="Practise for the Dutch driving theory exam and the Dutch integration exam. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klaar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Klaar</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <div class="top-in">
      <div class="brand">Klaar<span class="vh" id="brand-sub">Rijbewijs B</span></div>
    <div class="switch" role="tablist" aria-label="Track">
      <span class="thumb"></span>
      <button role="tab" data-track="drive" id="tr-drive"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" transform="rotate(45 12 12)" fill="none" stroke="currentColor" stroke-width="2"/><rect x="8.5" y="8.5" width="7" height="7" transform="rotate(45 12 12)" fill="currentColor"/></svg>Rijbewijs</button>
      <button role="tab" data-track="civic" id="tr-civic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="8.5" y1="16.5" x2="15.5" y2="16.5" stroke="currentColor" stroke-width="1.8"/></svg>Inburgering</button>
    </div>
    <button class="avatar" id="prof-btn" aria-label="Profile" aria-pressed="false"></button>
  </div>
</header>

<main id="main">
  <section id="v-home" hidden></section>
  <section id="v-feed"></section>
  <section id="v-exams" hidden></section>
  <section id="v-glossary" hidden></section>
  <section id="v-profile" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <div class="tabbar-in" role="tablist">
    <span class="tab-ind" aria-hidden="true"></span>
    <button class="tab" role="tab" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Home</button>
    <button class="tab" role="tab" data-view="feed"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 10l3-3 3 3M12 7v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Feed</button>
    <button class="tab" role="tab" data-view="exams"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2M9 2h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Exams</button>
  </div>
</nav>

<div id="overlay-root"></div>

<script src="js/i18n-data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/content.js"></script>
<script src="js/audio.js"></script>
<script src="js/lessons.js"></script>
<script src="js/view.js"></script>
<script src="js/map.js"></script>
<script src="js/glossary.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>

<script src="js/shell.js"></script>
<script src="js/setup.js"></script>
<script src="js/onboard.js"></script>
</body>
</html>
